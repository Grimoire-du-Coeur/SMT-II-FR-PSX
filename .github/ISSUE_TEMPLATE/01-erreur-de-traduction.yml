name: "Erreur de traduction"
description: "Faute, contresens, texte coupé, terme qui ne suit pas le dictionnaire."
title: "[Traduction] "
labels: ["traduction"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de relire le patch ! Un texte exact vaut mieux qu'une longue description :
        avec lui, on retrouve l'entrée dans `trad/` en quelques secondes.

        Avant d'ouvrir : vérifiez dans le [Dictionnaire](../blob/main/docs/Dictionnaire.md)
        que le terme n'est pas un choix d'équipe assumé.
  - type: input
    id: texte-fr
    attributes:
      label: "Texte affiché en jeu"
      description: "Recopiez la réplique telle qu'elle apparaît, même partiellement."
      placeholder: "Le COMP est indisponible."
    validations:
      required: true
  - type: input
    id: attendu
    attributes:
      label: "Ce qui devrait être affiché"
    validations:
      required: true
  - type: dropdown
    id: ou
    attributes:
      label: "Où ?"
      options:
        - "Dialogue (scène, PNJ)"
        - "Menu / COMP"
        - "Combat"
        - "Négociation avec un démon"
        - "Boutique / bar / casino"
        - "Objet, sort, démon"
        - "Écran de sauvegarde / carte"
        - "Je ne sais pas"
    validations:
      required: true
  - type: input
    id: fichier
    attributes:
      label: "Fichier et id (si vous les connaissez)"
      placeholder: "trad/dialogues/0x00xx.json — 0x0001"
  - type: textarea
    id: capture
    attributes:
      label: "Capture d'écran"
      description: "Glissez une image ici. Très utile pour les textes coupés."

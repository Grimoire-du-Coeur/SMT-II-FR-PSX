# Vérifie chaque proposition.
#
# Les remarques sont posées en annotations directement sur les lignes du
# diff, pas en commentaire : une proposition venue d'un fork (c'est le cas
# de presque toutes, puisque « modifier ce fichier » depuis le navigateur
# crée un fork) donne au robot un jeton en lecture seule.
name: Valider

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  traductions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Si l'outillage ou le dictionnaire change, son verdict change partout :
      # on valide alors tout le dépôt, pas seulement les fichiers du diff.
      - name: Lister les fichiers à valider
        id: fichiers
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "liste=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          outillage=$(git diff --name-only "$base" HEAD -- outils police docs/Dictionnaire.md amont || true)
          if [ -n "$outillage" ]; then
            echo "outillage modifié : validation de tout le dépôt"
            echo "liste=" >> "$GITHUB_OUTPUT"
          else
            liste=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'trad/**.json' | grep -v '/_' | tr '\n' ' ' || true)
            echo "liste=$liste" >> "$GITHUB_OUTPUT"
            echo "vide=$([ -z "$liste" ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"
          fi

      - name: Valider les traductions
        if: steps.fichiers.outputs.vide != 'oui'
        run: python outils/valider.py --github ${{ steps.fichiers.outputs.liste }}

      - name: trad/ est à jour avec l'amont
        run: python outils/extraire.py --verifier

  outils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
      - name: La réinjection produit des modules valides
        run: python outils/injecter.py

  sans-donnees-du-jeu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 outils/sans_donnees_jeu.py
